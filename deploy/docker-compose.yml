# Selvania Ciné sur le VPS, à côté de Jellyfin et Traefik.
# Le nom du réseau Docker de Traefik/Jellyfin se règle dans le fichier .env (TRAEFIK_NETWORK).

services:
  cine-web:
    image: nginx:1.27-alpine
    container_name: cine-web
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
