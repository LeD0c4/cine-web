# Selvania Ciné : l'interface + Jellyfin relayé sous /jellyfin (même adresse, pas de blocage CORS).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Fichiers compilés (nom unique à chaque version) : gardés en cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # La page elle-même : toujours la dernière version.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  # API et vidéos Jellyfin
  location /jellyfin/ {
    proxy_pass http://jellyfin:8096/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 50m;
  }
}
